# Конфигурация ядра компьютерного зрения LinQ Safety Guard
# Аппаратное ускорение на отечественных чипах LinQ TPU (H1M)

inference:
  # Варианты: LINQ_TPU (чип H1M), ONNX_CPU (локальный фоллбэк), MOCK (тестирование)
  backend: "ONNX_CPU"
  tpu_model_path: "models/tpu/safety_yolov8n_b1_o1_h1m.tpu"
  onnx_model_path: "models/onnx/safety_yolov8.onnx"
  input_size: [640, 640]
  confidence_threshold: 0.15  # Preserve low-score detections for ByteTrack; new tracks require 0.45
  iou_threshold: 0.45
  device_id: 0
  # ONNX: read exact class names from model metadata. TPU: set training labels here.
  class_names: null
  adapter_module: null

tracking:
  algorithm: "bytetrack"
  high_threshold: 0.45
  low_threshold: 0.15
  match_threshold_high: 0.75
  match_threshold_low: 0.50
  max_lost_frames: 30
  min_hits_to_confirm: 2

rules:
  danger_zone:
    enabled: true
    default_severity: "CRITICAL"
  proximity:
    enabled: true
    safe_distance_px: 140.0
    severity: "HIGH"
  fall_detection:
    enabled: true
    aspect_ratio_threshold: 1.2
    max_speed_px: 2.0
    min_frames_lying: 12
    min_lying_seconds: 3.0
    severity: "CRITICAL"
  ppe_compliance:
    enabled: true
    require_helmet: true
    require_vest: true
    severity: "HIGH"

deduplication:
  debounce_frames: 10      # Количество кадров подтверждения нарушения (~0.4 сек)
  debounce_seconds: 1.5    # Both frame and elapsed-time confirmation must pass
  cooldown_seconds: 20.0    # Интервал повторных оповещений между эпизодами нарушения (20 сек)
  resolve_frames: 25        # Кадров отсутствия нарушения для закрытия инцидента

cameras:
  # Match backend IDs; redraw example polygons for your original video resolution.
  - camera_id: "CAM-01"
    site_id: "north"
    zone: "gate"
    source: null
    name: "Сборочный цех №1"
    zones:
      - zone_id: "danger_zone_crane"
        name: "Зона работы мостового крана"
        severity: "CRITICAL"
        forbidden_classes: ["person"]
        polygon: [[100, 100], [500, 100], [500, 400], [100, 400]]
