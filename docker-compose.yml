services:
  # 1. Реляционная база данных PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: linq_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-linq_safety}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-linq_safety}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Сервис бэкенда и видеоаналитики (FastAPI + CV Engine)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linq_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LINQ_TG_TOKEN=${LINQ_TG_TOKEN:-}
      - LINQ_PUBLIC_URL=${LINQ_PUBLIC_URL:-http://localhost:3000}
      - HTTPS_PROXY=${HTTPS_PROXY:-http://192.168.65.254:7890}
      - HTTP_PROXY=${HTTP_PROXY:-http://192.168.65.254:7890}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,postgres,backend,minio}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-linq_safety}
      - INFERENCE_BACKEND=${INFERENCE_BACKEND:-ONNX_CPU}
      - ONNX_MODEL_PATH=models/onnx/safety_yolov8n.onnx
      - TPU_MODEL_PATH=models/tpu/safety_yolov8_h1m.tpu
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-True}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./storage/snapshots:/app/storage/snapshots
      - ./storage/demo_videos:/app/storage/demo_videos
      - ./data:/app/data
      - ./app:/app/app
      - ./engine:/app/engine
      - ./run.py:/app/run.py
      - ./run_worker.py:/app/run_worker.py

  # 3. Фронтенд (React SPA + Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: linq_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html

  # 4. Опционально: локальное S3-хранилище на MinIO
  minio:
    image: minio/minio:latest
    container_name: linq_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    profiles:
      - minio

volumes:
  postgres_data:
  minio_data:
